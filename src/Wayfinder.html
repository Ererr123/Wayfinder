<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wayfinder</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- astronomy-engine: exposes window.Astronomy for LST calculation -->
  <script src="https://unpkg.com/astronomy-engine/astronomy.browser.js"></script>
</head>
<body>

  <!-- Ground layer: Mapbox satellite map, shown below the horizon -->
  <div id="map-view"></div>

  <!-- Sky layer: Three.js canvas with alpha:true — transparent where no star -->
  <canvas id="c"></canvas>

  <!-- Horizon glow line, positioned by JS each frame -->
  <div id="horizon-line"></div>

  <!-- Search panel -->
  <div class="panel" id="search-wrap">
    <input id="search-input" type="text" placeholder="SEARCH THE STARS..."
           autocomplete="on" spellcheck="false"/>
    <div id="search-divider"></div>
    <div id="search-results"></div>
  </div>

  <!-- Star info panel -->
  <div class="panel" id="info-panel">
    <button id="info-close">×</button>
    <div id="star-name">-</div>
    <div class="info-row"><span class="info-lbl">Magnitude</span><span class="info-val" id="i-mag">-</span></div>
    <div class="info-row"><span class="info-lbl">RA</span>       <span class="info-val" id="i-ra">-</span></div>
    <div class="info-row"><span class="info-lbl">Dec</span>      <span class="info-val" id="i-dec">-</span></div>
    <div class="info-row"><span class="info-lbl">Distance</span> <span class="info-val" id="i-dist">-</span></div>
    <div class="info-row"><span class="info-lbl">Spectral</span> <span class="info-val" id="i-spec">-</span></div>
    <div id="i-not-visible" style="display:none; margin-top:8px; font-size:10px; letter-spacing:0.06em; color:rgba(255,120,120,0.8);">NOT VISIBLE FROM YOUR LOCATION</div>
  </div>

  <!-- Location & LST panel -->
  <div class="panel" id="location-panel">
    <div id="loc-header">
      <span>Location</span>
      <button id="loc-toggle">▾</button>
    </div>
    <div id="loc-body">
      <input id="loc-address" type="text" placeholder="Address, city, or lat, lon…"
             autocomplete="off" spellcheck="false"/>
      <button class="loc-btn" id="loc-gps">Use Current Location</button>
      <div class="loc-row">
        <label for="loc-lat">Lat</label>
        <input type="number" id="loc-lat" placeholder="0.0000"
               step="0.0001" min="-90" max="90">
      </div>
      <div class="loc-row">
        <label for="loc-lon">Lon</label>
        <input type="number" id="loc-lon" placeholder="0.0000"
               step="0.0001" min="-180" max="180">
      </div>
      <div class="loc-row">
        <label>Date</label>
        <div id="loc-date-wrap">
          <input type="number" id="loc-year"  min="1900" max="2100">
          <span class="date-sep">-</span>
          <input type="number" id="loc-month" min="1" max="12">
          <span class="date-sep">-</span>
          <input type="number" id="loc-day"   min="1" max="31">
        </div>
      </div>
      <div class="loc-row">
        <label for="loc-time">Time</label>
        <input type="time" id="loc-time" step="60">
      </div>
      <button class="loc-btn" id="loc-apply">Orient sky to now</button>
      <button class="loc-btn" id="loc-reset">Reset to default</button>
      <div class="loc-row" id="loc-lst-row" style="display:none">
        <span class="info-lbl">Time</span>
        <span id="loc-lst" class="info-val">-</span>
      </div>
    </div>
  </div>

  <div id="hints">Drag to look around &nbsp;|&nbsp; Scroll to zoom &nbsp;|&nbsp; Click a star</div>
  <div id="counter"></div>
  <div id="const-label"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
